name: CI Validation

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-code:
    name: Go Engine, TypeSpec, Web & Shell Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install pnpm dependencies
        run: |
          (cd spec && pnpm install)
          (cd web && pnpm install)

      - name: Install system tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: Quality gates (make check)
        run: make check

      - name: Validate Docker Compose Configuration
        run: |
          cp .env.example .env
          docker compose config
          echo "Docker compose configuration is valid!"

  validate-website:
    name: Build Astro Static Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'website/package-lock.json'

      - name: Install website dependencies
        run: |
          cd website
          npm ci

      - name: Lint website (oxlint)
        run: |
          cd website
          npm run lint

      - name: Validate Astro Build
        run: |
          cd website
          npm run build

  build-containers:
    name: Test Docker Builds
    runs-on: ubuntu-latest
    needs: [validate-code, validate-website]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Autoscaler Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.autoscaler
          push: false
          tags: local-runner-autoscaler:test

      - name: Build AMD64 Runner Image
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          tags: local-github-runner:amd64-test

  build-runner-arm64:
    name: Test ARM64 Runner Image Build
    # Native arm64 runner: Apple Silicon hosts run this image, so it must build there too.
    runs-on: ubuntu-24.04-arm
    needs: [validate-code]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ARM64 Runner Image
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          file: docker/Dockerfile
          platforms: linux/arm64
          push: false
          tags: local-github-runner:arm64-test
