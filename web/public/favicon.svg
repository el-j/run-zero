<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Martian Crimson to Solar Amber Plasma Gradient -->
    <linearGradient id="martian-core" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff3355" />
      <stop offset="50%" stop-color="#ff6b35" />
      <stop offset="100%" stop-color="#ff9f1c" />
    </linearGradient>

    <!-- Deep Carbon Ring Gradient -->
    <linearGradient id="orbit-ring" x1="12" y1="12" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#ff3355" />
      <stop offset="100%" stop-color="#ff9f1c" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="crimson-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Icon Plate -->
  <rect width="64" height="64" rx="14" fill="#06080d" />
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" stroke="#ff3355" stroke-opacity="0.25" />

  <!-- Outer Orbital Zero Ring (Ø Outer Arc Upper-Left) -->
  <path d="M 32 10 A 22 22 0 0 1 54 32 A 22 22 0 0 1 49.5 45.2" 
        stroke="url(#orbit-ring)" stroke-width="4.5" stroke-linecap="round" />

  <!-- Outer Orbital Zero Ring (Ø Outer Arc Lower-Right) -->
  <path d="M 32 54 A 22 22 0 0 1 10 32 A 22 22 0 0 1 14.5 18.8" 
        stroke="url(#orbit-ring)" stroke-width="4.5" stroke-linecap="round" />

  <!-- The Zero Singularity Slash (Ø 45-degree Laser Cut) -->
  <line x1="12" y1="52" x2="52" y2="12" 
        stroke="url(#martian-core)" stroke-width="5" stroke-linecap="round" filter="url(#crimson-glow)" />

  <!-- Inner Sub-atomic Plasma Core -->
  <circle cx="32" cy="32" r="5" fill="url(#martian-core)" filter="url(#crimson-glow)" />
  <circle cx="32" cy="32" r="2" fill="#ffffff" />
</svg>
