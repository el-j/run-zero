name: Deploy Multi-Version Documentation to gh-pages

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'website/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'gh-pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy to gh-pages Branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'website/package-lock.json'

      - name: Install dependencies
        run: |
          cd website
          npm ci

      - name: Build Astro Static Site (Latest Release)
        run: |
          cd website
          npm run build

      - name: Create Versioned Snapshot Copy
        run: |
          # Fetch latest tag or fallback to v2.0.0
          CURRENT_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v2.0.0")
          echo "Creating snapshot for version: $CURRENT_VERSION"
          
          # Duplicate build into version subdirectory
          mkdir -p website/dist/${CURRENT_VERSION}
          cp -r website/dist/docs website/dist/${CURRENT_VERSION}/ || true
          cp -r website/dist/_astro website/dist/${CURRENT_VERSION}/ || true
          cp -r website/dist/fonts website/dist/${CURRENT_VERSION}/ || true
          cp website/dist/index.html website/dist/${CURRENT_VERSION}/ || true
          cp website/dist/favicon.svg website/dist/${CURRENT_VERSION}/ || true
          
          # Ensure .nojekyll is present to prevent GitHub Pages from ignoring _astro
          touch website/dist/.nojekyll

      - name: Deploy to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website/dist
          publish_branch: gh-pages
          keep_files: true
          cname: ''
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
