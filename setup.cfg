# flake8 cannot read pyproject.toml, so its configuration lives here. Keep in sync with
# [tool.ruff] line-length in pyproject.toml. (mutmut is configured in pyproject.toml.)
[flake8]
max-line-length = 160
extend-ignore = E203,E501,W503,E402
exclude = .git,__pycache__,.venv,.venv-dev,mutants,website,docs
