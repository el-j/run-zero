name: Mutation Testing

# Mutation testing is run locally and differentially on changed files via:
#   make mutation-test (or scripts/mutation_changed.py)
#
# Automated CI triggers (schedule / pull_request) have been removed to eliminate
# wasted GitHub Actions runner minutes. This workflow is retained exclusively for
# manual, on-demand cloud dispatch when a full audit is explicitly requested.
on:
  workflow_dispatch: {}

jobs:
  mutation-test:
    name: Mutmut Mutation Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run mutation testing suite
        run: make mutation-test

      - name: Generate mutation dashboard artifacts
        if: always()
        run: make mutation-report

      - name: Publish mutation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: |
            reports/mutation/
            mutants/mutmut-cicd-stats.json

      - name: Append mutation summary to workflow
        if: always()
        run: |
          if [ -f reports/mutation/latest.md ]; then
            cat reports/mutation/latest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Mutation report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi
