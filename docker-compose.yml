networks:
  runner-network:
    name: runner-network
    driver: bridge

services:
  # ============================================================================
  # Mode 1: Dynamic On-Demand Runner Autoscaler (Containerized)
  # ============================================================================
  # Runs the RunZero autoscaler inside a container with built-in Web UI Dashboard
  # (http://localhost:49505) and Host VM Bridge support (OrbStack, WSL2, Multipass)
  # via http://host.docker.internal:49504.
  autoscaler:
    build:
      context: .
      dockerfile: docker/Dockerfile.autoscaler
    image: local-runner-autoscaler:latest
    container_name: local-runner-autoscaler
    restart: unless-stopped
    networks:
      - runner-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "49505:49505"
    depends_on:
      - verdaccio
      - athens
      - docker-mirror
      - devpi
      - kellnr
    environment:
      - ACCESS_TOKEN=${ACCESS_TOKEN:-}
      - OWNER=${OWNER:-}
      - REPOS=${REPOS:-${REPO:-}}
      - ORG=${ORG:-}
      - AUTO_DISCOVER_REPOS=${AUTO_DISCOVER_REPOS:-true}
      - RUNNER_ARCH=${RUNNER_ARCH:-both}
      - MIN_RUNNERS=${MIN_RUNNERS:-0}
      - MAX_RUNNERS=${MAX_RUNNERS:-4}
      - POLL_INTERVAL=${POLL_INTERVAL:-5}
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
      - PROXIES_ENABLED=${PROXIES_ENABLED:-true}
      - DOCKER_NETWORK=runner-network
      - HOST_CACHE_DIR=${HOST_CACHE_DIR:-}
      - RUNNER_LABELS=${RUNNER_LABELS:-}
      - DASHBOARD_ENABLED=${DASHBOARD_ENABLED:-true}
      - DASHBOARD_PORT=49505
      - HOST_VM_BRIDGE_URL=${HOST_VM_BRIDGE_URL:-http://host.docker.internal:49504}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace:ro
      # cache_manager.py's init_cache_dirs() runs INSIDE this container and calls
      # os.makedirs()/os.chmod() on HOST_CACHE_DIR to prepare per-language cache
      # subdirectories, then hands their paths straight to `docker run -v host:container`
      # (issued against the HOST's Docker daemon via the socket mount above) when spawning
      # each ephemeral runner. Without this bind mount, those os.makedirs() calls land in
      # this container's own disposable overlay filesystem -- a real directory from the
      # container's point of view, but invisible to the actual host and to the runner
      # containers Docker then spawns pointing at that same path. Confirmed live
      # (2026-08-26) via `docker inspect`: the running autoscaler container had no mount
      # for HOST_CACHE_DIR at all, so the dashboard's Cache Analytics panel correctly
      # reported 0 B for every category even though the code "looked" wired up. Mounting
      # the exact same path on both sides (source == target) means paths written by this
      # container and paths referenced by the host's `docker run -v` are identical strings
      # that also resolve to the same real inode -- no translation needed anywhere else in
      # the codebase. Falls back to a harmless throwaway path when HOST_CACHE_DIR is unset
      # (e.g. CACHE_ENABLED=false), since Compose can't conditionally omit a volume line.
      - ${HOST_CACHE_DIR:-/tmp/runzero-cache-disabled}:${HOST_CACHE_DIR:-/tmp/runzero-cache-disabled}


  # ============================================================================
  # Caching Proxy Services (NPM, Go, Docker Hub, APT)
  # ============================================================================
  # apt-cacher-ng: Caching proxy for .deb packages, used by docker/provision-toolchain.sh
  # (the shared toolchain script both the Docker image and the OrbStack VM golden
  # image run) -- without this, rebuilding either image after an edit to that
  # script re-downloads ~3GB of apt packages (base OS deps, .NET SDK, Chrome,
  # Docker engine on the VM side) from the internet every single time.
  apt-cacher:
    image: sameersbn/apt-cacher-ng:latest
    container_name: local-runner-apt-cacher
    restart: unless-stopped
    networks:
      - runner-network
    ports:
      - "49503:3142"
    volumes:
      - apt-cacher-storage:/var/cache/apt-cacher-ng

  # Verdaccio: Fast Local Caching NPM Proxy & Private Registry + Web UI
  verdaccio:
    image: verdaccio/verdaccio:5
    container_name: local-runner-verdaccio
    restart: unless-stopped
    networks:
      - runner-network
    # Published in the IANA dynamic/private range (49152-65535), well clear of
    # dev-tool conventions (3000s/4000s/5173/8080/9000) — with runners now on
    # --network host, a common-range port here would collide with whatever a
    # developer has running locally on this same machine.
    ports:
      - "49501:4873"
    environment:
      - VERDACCIO_PORT=4873
    volumes:
      - verdaccio-storage:/verdaccio/storage

  # Athens: Local Caching Proxy for Go Modules
  athens:
    image: gomods/athens:latest
    container_name: local-runner-athens
    restart: unless-stopped
    networks:
      - runner-network
    ports:
      - "49500:3000"
    environment:
      - ATHENS_DISK_STORAGE_ROOT=/var/lib/athens
      - ATHENS_STORAGE_TYPE=disk
    volumes:
      - athens-storage:/var/lib/athens

  # Docker Registry Mirror: Pull-through cache for Docker Hub images
  docker-mirror:
    image: registry:2
    container_name: local-runner-docker-mirror
    restart: unless-stopped
    networks:
      - runner-network
    ports:
      - "49502:5000"
    environment:
      - REGISTRY_PROXY_REMOTEURL=https://registry-1.docker.io
    volumes:
      - docker-mirror-storage:/var/lib/registry

  # devpi: Real pull-through caching proxy for PyPI (pip & uv). Its default "root/pypi"
  # index (auto-created on init) mirrors pypi.org per-package on first request and serves
  # every subsequent request for that package/version from local disk -- verified live
  # (2026-08-26): a real `pip install`/`uv pip install` through this exact image populates
  # devpi-storage, and a second install of the same package is served from cache. No
  # actively-maintained official multi-arch image exists for it (public Docker Hub images
  # are unmaintained/amd64-only), so this is a small first-party image, built the same way
  # this repo already builds its own runner/autoscaler images -- see docker/Dockerfile.devpi.
  devpi:
    build:
      context: .
      dockerfile: docker/Dockerfile.devpi
    image: local-runner-devpi:latest
    container_name: local-runner-devpi
    restart: unless-stopped
    networks:
      - runner-network
    ports:
      - "49507:3141"
    volumes:
      - devpi-storage:/data

  # kellnr: Real pull-through caching proxy for Cargo/crates.io, via its built-in
  # "crates.io proxy" feature (a genuine sparse-index mirror, not a blind HTTP cache) --
  # verified live (2026-08-26): a real `cargo build` against a crates.io dependency,
  # pointed at this exact image via cargo's source-replacement env vars
  # (CARGO_SOURCE_CRATES_IO_REPLACE_WITH / CARGO_SOURCE_KELLNR_PROXY_REGISTRY), resolves
  # and compiles successfully, and the fetched .crate is persisted under kellnr-storage.
  kellnr:
    image: ghcr.io/kellnr/kellnr:6
    container_name: local-runner-kellnr
    restart: unless-stopped
    networks:
      - runner-network
    ports:
      - "49506:8000"
    environment:
      # kellnr bakes this into the "dl" (download) URL its sparse-index config.json
      # advertises to every client -- it is NOT derived from the request's Host header
      # (verified live: querying config.json via a different hostname still returned
      # this fixed value). "host.orb.internal" is OrbStack's own universal DNS name for
      # the Mac host, and -- unlike "localhost" -- it resolves correctly from ALL of this
      # stack's real client contexts: OrbStack VMs (confirmed live), Docker containers on
      # --network host, AND Docker containers on a regular bridge network. Confirmed live
      # (2026-08-26) this was a real, silent breakage: with KELLNR_ORIGIN__HOSTNAME=localhost,
      # cargo's sparse-index metadata fetch succeeded (reaching kellnr fine via
      # host.orb.internal) but the actual .crate download then failed outright --
      # "Could not connect to localhost:49506" -- because "localhost" inside a VM means the
      # VM itself, not the Mac host serving kellnr.
      - KELLNR_ORIGIN__HOSTNAME=host.orb.internal
      - KELLNR_ORIGIN__PORT=49506
      - KELLNR_REGISTRY__DATA_DIR=/opt/kellnr/data
      - KELLNR_PROXY__ENABLED=true
    volumes:
      - kellnr-storage:/opt/kellnr/data

  # ============================================================================
  # Mode 2: Static Fixed Runner Services (Alternative profile)
  # ============================================================================
  github-runner-arm64:
    build:
      context: ./docker
      dockerfile: Dockerfile
    image: local-github-runner:arm64
    platform: linux/arm64
    restart: unless-stopped
    networks:
      - runner-network
    profiles:
      - static
    environment:
      - REPO=${REPO:-}
      - ORG=${ORG:-}
      - ACCESS_TOKEN=${ACCESS_TOKEN:-}
      - RUNNER_TOKEN=${RUNNER_TOKEN:-}
      - RUNNER_NAME=${RUNNER_NAME:-local-runner-arm64}
      - RUNNER_LABELS=${RUNNER_LABELS:-self-hosted,local,arm64}
      - RUNNER_WORKDIR=${RUNNER_WORKDIR:-_work}
      - EPHEMERAL=${EPHEMERAL:-false}
      - NPM_CONFIG_REGISTRY=http://verdaccio:4873/
      - GOPROXY=http://athens:3000,https://proxy.golang.org,direct
      - PIP_INDEX_URL=http://devpi:3141/root/pypi/+simple/
      - UV_INDEX_URL=http://devpi:3141/root/pypi/+simple/
      # pip refuses a plain-HTTP index on any host but localhost/127.0.0.1 unless it's
      # explicitly trusted (verified live: without this, pip silently installs nothing and
      # still exits 0) -- uv has no equivalent restriction.
      - PIP_TRUSTED_HOST=devpi
      # No CARGO_SOURCE_* env var here -- cargo doesn't honor those for a dynamic
      # [source.*] table (verified live, see docker/start.sh's comment). start.sh
      # (this image's own entrypoint) writes a real ~/.cargo/config.toml at container
      # start once it detects kellnr on the network -- these containers reach it at
      # http://kellnr:8000 via runner-network's Compose DNS, not localhost.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-work-arm64:/home/runner/actions-runner/_work
      - runner-cache-npm:/home/runner/.npm
      - runner-cache-pip:/home/runner/.cache/pip
      - runner-cache-go:/home/runner/go/pkg/mod
      - runner-cache-tool:/opt/hostedtoolcache

  github-runner-amd64:
    build:
      context: ./docker
      dockerfile: Dockerfile
    image: local-github-runner:amd64
    platform: linux/amd64
    restart: unless-stopped
    networks:
      - runner-network
    profiles:
      - static
    environment:
      - REPO=${REPO:-}
      - ORG=${ORG:-}
      - ACCESS_TOKEN=${ACCESS_TOKEN:-}
      - RUNNER_TOKEN=${RUNNER_TOKEN:-}
      - RUNNER_NAME=${RUNNER_NAME:-local-runner-amd64}
      - RUNNER_LABELS=${RUNNER_LABELS:-self-hosted,local,x64,amd64}
      - RUNNER_WORKDIR=${RUNNER_WORKDIR:-_work}
      - EPHEMERAL=${EPHEMERAL:-false}
      - NPM_CONFIG_REGISTRY=http://verdaccio:4873/
      - GOPROXY=http://athens:3000,https://proxy.golang.org,direct
      - PIP_INDEX_URL=http://devpi:3141/root/pypi/+simple/
      - UV_INDEX_URL=http://devpi:3141/root/pypi/+simple/
      # pip refuses a plain-HTTP index on any host but localhost/127.0.0.1 unless it's
      # explicitly trusted (verified live: without this, pip silently installs nothing and
      # still exits 0) -- uv has no equivalent restriction.
      - PIP_TRUSTED_HOST=devpi
      # No CARGO_SOURCE_* env var here -- cargo doesn't honor those for a dynamic
      # [source.*] table (verified live, see docker/start.sh's comment). start.sh
      # (this image's own entrypoint) writes a real ~/.cargo/config.toml at container
      # start once it detects kellnr on the network -- these containers reach it at
      # http://kellnr:8000 via runner-network's Compose DNS, not localhost.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-work-amd64:/home/runner/actions-runner/_work
      - runner-cache-npm:/home/runner/.npm
      - runner-cache-pip:/home/runner/.cache/pip
      - runner-cache-go:/home/runner/go/pkg/mod
      - runner-cache-tool:/opt/hostedtoolcache

volumes:
  apt-cacher-storage:
  verdaccio-storage:
  athens-storage:
  docker-mirror-storage:
  devpi-storage:
  kellnr-storage:
  runner-work-arm64:
  runner-work-amd64:
  runner-cache-npm:
  runner-cache-pip:
  runner-cache-go:
  runner-cache-tool:
