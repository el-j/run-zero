name: Mutation Testing

# Mutation testing is run locally and differentially on changed files via:
#   make mutation-test (or scripts/mutation_changed.py)
#
# Automated CI triggers (schedule / pull_request) have been removed to eliminate
# wasted GitHub Actions runner minutes. This workflow is retained exclusively for
# manual, on-demand cloud dispatch when a full audit is explicitly requested.
on:
  workflow_dispatch:
    inputs:
      target_module:
        description: 'Module to mutate (e.g. src/autoscaler.py, or "all" to run the full matrix)'
        required: false
        default: 'all'

jobs:
  mutation-matrix:
    name: Mutmut (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - src/autoscaler.py
          - src/config.py
          - src/dashboard/server.py
          - src/dashboard/state.py
          - src/discovery.py
          - src/drivers/backoff.py
          - src/drivers/bridge_driver.py
          - src/drivers/docker_driver.py
          - src/drivers/instance_store.py
          - src/drivers/multipass_driver.py
          - src/drivers/orbstack_image.py
          - src/drivers/orbstack_vm_driver.py
          - src/drivers/runner_bootstrap.py
          - src/drivers/wsl_driver.py
          - src/github_api.py
          - src/http_security.py
          - src/reconciler.py
          - src/router.py
          - src/vm_bridge.py
          - src/workflow_inspector.py
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run mutation testing on module
        run: |
          if [ "${{ github.event.inputs.target_module }}" != "all" ] && [ "${{ github.event.inputs.target_module }}" != "${{ matrix.module }}" ]; then
            echo "Skipping ${{ matrix.module }} per input filter: ${{ github.event.inputs.target_module }}"
            exit 0
          fi
          python scripts/mutation_changed.py --files ${{ matrix.module }}

      - name: Generate mutation dashboard artifacts
        if: always()
        run: make mutation-report

      - name: Publish module mutation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report-${{ strategy.job-index }}
          path: |
            reports/mutation/
            mutants/mutmut-cicd-stats.json

      - name: Append mutation summary to workflow
        if: always()
        run: |
          if [ -f reports/mutation/latest.md ]; then
            cat reports/mutation/latest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Mutation report for ${{ matrix.module }} not generated." >> "$GITHUB_STEP_SUMMARY"
          fi
