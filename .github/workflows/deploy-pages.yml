name: Deploy Multi-Version Documentation to gh-pages

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/deploy-pages.yml'
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'gh-pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy to gh-pages Branch
    runs-on: ubuntu-latest
    env:
      SITE_BASE: /run-zero
      SITE_URL: https://el-j.github.io/run-zero
      REPO_URL: https://github.com/${{ github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'website/package-lock.json'

      - name: Install dependencies
        run: |
          cd website
          npm ci

      - name: Generate versions manifest
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const { execSync } = require("child_process");

          const siteBase = process.env.SITE_BASE || "/run-zero";
          const repoUrl = process.env.REPO_URL || "";
          const rawTags = execSync("git tag --list 'v*' --sort=-v:refname", { encoding: "utf8" })
            .trim()
            .split("\n")
            .filter(Boolean);

          const versions = rawTags.map((tag, idx) => {
            const releaseDate = execSync(`git log -1 --format=%cs ${tag}`, { encoding: "utf8" }).trim();
            return {
              version: tag,
              name: idx === 0 ? `${tag} (Latest Release)` : tag,
              url: `${siteBase}/${tag}/`,
              docsUrl: `${siteBase}/${tag}/docs/`,
              releaseDate,
              status: idx === 0 ? "latest" : "archived",
              notes: `Pinned documentation snapshot for RunZero ${tag}.`,
              changelogUrl: `${repoUrl}/releases/tag/${tag}`
            };
          });

          fs.writeFileSync("website/public/versions.json", `${JSON.stringify(versions, null, 2)}\n`, "utf8");
          NODE

      - name: Build Astro current site
        run: |
          rm -rf website/dist website/dist-live website/dist-archive
          cd website
          DEPLOY_BASE="${SITE_BASE}" \
          DEPLOY_SITE="${SITE_URL}" \
          PUBLIC_DOCS_VERSION="main" \
          npm run build
          mv dist dist-live

      - name: Build stable release snapshots
        run: |
          mapfile -t STABLE_VERSIONS < <(node -e 'const fs=require("fs");const versions=JSON.parse(fs.readFileSync("website/public/versions.json","utf8"));for (const entry of versions){if(entry.version) console.log(entry.version)}')

          for VERSION in "${STABLE_VERSIONS[@]}"; do
            echo "Building stable docs snapshot for ${VERSION}"
            rm -rf website/dist
            cd website
            DEPLOY_BASE="${SITE_BASE}/${VERSION}" \
            DEPLOY_SITE="${SITE_URL}/${VERSION}" \
            PUBLIC_DOCS_VERSION="${VERSION}" \
            npm run build
            cd ..
            mkdir -p "website/dist-live/${VERSION}"
            cp -R website/dist/. "website/dist-live/${VERSION}/"
          done

      - name: Finalize static output
        run: |
          touch website/dist-live/.nojekyll

      - name: Deploy to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website/dist-live
          publish_branch: gh-pages
          keep_files: true
          cname: ''
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
