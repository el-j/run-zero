version: "2"

linters:
  # Keep golangci-lint's standard set (errcheck, govet, ineffassign,
  # staticcheck, unused) and add function size/complexity limits (AUDIT-03).
  default: standard
  enable:
    - funlen
    - gocognit
    - gocyclo
  settings:
    funlen:
      lines: 80
      statements: 50
      ignore-comments: true
    gocognit:
      min-complexity: 30
    gocyclo:
      min-complexity: 20
  exclusions:
    rules:
      # Table-driven tests read best as one long function.
      - path: _test\.go
        linters: [funlen, gocognit, gocyclo]
      # Scenario fixtures are a data table, not logic.
      - path: pkg/parity/fixtures\.go
        linters: [funlen]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
