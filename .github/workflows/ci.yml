name: CI Validation

on:
  push:
    branches:
      - main
      - develop
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate-code:
    name: Python Lint, Type Check & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Testing & Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 mypy pytest pytest-cov

      - name: Flake8 Code Linting
        run: |
          flake8 src/ tests/ --max-line-length=160 --extend-ignore=E501,W503,E402

      - name: Mypy Static Type Checking
        run: |
          MYPYPATH=src mypy src/drivers/ src/autoscaler.py --ignore-missing-imports

      - name: Run Pytest with Code Coverage
        run: |
          PYTHONPATH=src pytest --cov=src --cov-report=term-missing tests/

      - name: Validate Shell Script Syntax
        run: |
          bash -n docker/start.sh
          bash -n scripts/setup_env.sh
          echo "Bash scripts syntax is valid!"

      - name: Validate Docker Compose Configuration
        run: |
          cp .env.example .env
          docker compose config
          echo "Docker compose configuration is valid!"

  validate-website:
    name: Build Astro Static Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'website/package-lock.json'

      - name: Install website dependencies
        run: |
          cd website
          npm ci

      - name: Validate Astro Build
        run: |
          cd website
          npm run build

  build-containers:
    name: Test Docker Builds
    runs-on: ubuntu-latest
    needs: [validate-code, validate-website]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Autoscaler Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.autoscaler
          push: false
          tags: local-runner-autoscaler:test

      - name: Build AMD64 Runner Image
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          tags: local-github-runner:amd64-test
