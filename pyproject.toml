[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "run-zero"
version = "0.0.1"
description = "Dual-Engine Autoscaling GitHub Actions Runner Fleet for Docker & Linux VMs"
readme = "README.md"
requires-python = ">=3.9"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q --cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
omit = [
    "tests/*"
]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[tool.mutmut]
paths_to_mutate = "src/"
runner = "python -m pytest -q"
