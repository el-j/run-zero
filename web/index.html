<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RunZero · Cloud-Native CI Control Plane</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
    <meta name="description" content="RunZero Autoscaler and Control Plane for GitHub Actions" />
  </head>
  <body>
    <div class="app-container">
      <div id="header-root"></div>

      <main id="content-root">
        <!-- Fleet & Queue View -->
        <div id="tab-fleet-section">
          <div id="capacity-root"></div>
          <div id="queue-root"></div>
          <div id="priority-root"></div>
          <div id="fleet-root"></div>
        </div>

        <!-- Live Settings View -->
        <div id="settings-root" style="display: none;"></div>

        <!-- Cache Control Plane View -->
        <div id="cache-root" style="display: none;"></div>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
