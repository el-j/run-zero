name: CI Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-code:
    name: Lint & Validate Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Validate Python Syntax
        run: |
          python3 -m py_compile docker/autoscaler.py
          echo "Python syntax is valid!"

      - name: Validate Shell Script Syntax
        run: |
          bash -n docker/start.sh
          echo "Bash scripts syntax is valid!"

      - name: Validate Docker Compose Configuration
        run: |
          cp .env.example .env
          docker compose config
          echo "Docker compose configuration is valid!"

  build-containers:
    name: Test Docker Builds
    runs-on: ubuntu-latest
    needs: validate-code
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Autoscaler Image
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          file: docker/Dockerfile.autoscaler
          push: false
          tags: local-runner-autoscaler:test

      - name: Build AMD64 Runner Image
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          tags: local-github-runner:amd64-test
