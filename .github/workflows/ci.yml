name: CI Validation

on:
  push:
    branches:
      - main
      - develop
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate-code:
    name: Python Lint, Type Check & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install pinned dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      # One entry point shared with local dev and the pre-commit hook: ruff lint + format,
      # flake8, mypy, interrogate, pytest (100% coverage, warnings are errors), bash -n, shellcheck.
      - name: Quality gates (make check)
        run: make check PY=python

      - name: Validate Docker Compose Configuration
        run: |
          cp .env.example .env
          docker compose config
          echo "Docker compose configuration is valid!"

  validate-website:
    name: Build Astro Static Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'website/package-lock.json'

      - name: Install website dependencies
        run: |
          cd website
          npm ci

      - name: Lint website (oxlint)
        run: |
          cd website
          npm run lint

      - name: Validate Astro Build
        run: |
          cd website
          npm run build

  build-containers:
    name: Test Docker Builds
    runs-on: ubuntu-latest
    needs: [validate-code, validate-website]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Autoscaler Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.autoscaler
          push: false
          tags: local-runner-autoscaler:test

      - name: Build AMD64 Runner Image
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          tags: local-github-runner:amd64-test

  build-runner-arm64:
    name: Test ARM64 Runner Image Build
    # Native arm64 runner: Apple Silicon hosts run this image, so it must build there too.
    runs-on: ubuntu-24.04-arm
    needs: [validate-code]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ARM64 Runner Image
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          file: docker/Dockerfile
          platforms: linux/arm64
          push: false
          tags: local-github-runner:arm64-test
