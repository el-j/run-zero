name: Deploy Multi-Version Documentation to gh-pages

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/deploy-pages.yml'
      - 'scripts/generate_versions_manifest.py'
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'gh-pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy to gh-pages Branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'website/package-lock.json'

      - name: Install dependencies
        run: |
          cd website
          npm ci

      - name: Generate versions manifest
        run: |
          python scripts/generate_versions_manifest.py --output website/public/versions.json

      - name: Build Astro current site
        run: |
          rm -rf website/dist website/dist-live website/dist-archive
          cd website
          DEPLOY_BASE="/run-zero" \
          DEPLOY_SITE="https://el-j.github.io/run-zero" \
          PUBLIC_DOCS_VERSION="main" \
          npm run build
          mv dist dist-live

      - name: Build stable release snapshot
        if: github.event_name == 'release'
        run: |
          CURRENT_VERSION="${{ github.event.release.tag_name }}"
          cd website
          DEPLOY_BASE="/run-zero/${CURRENT_VERSION}" \
          DEPLOY_SITE="https://el-j.github.io/run-zero/${CURRENT_VERSION}" \
          PUBLIC_DOCS_VERSION="${CURRENT_VERSION}" \
          npm run build
          mv dist dist-archive
          mkdir -p "dist-live/${CURRENT_VERSION}"
          cp -R dist-archive/. "dist-live/${CURRENT_VERSION}/"

      - name: Finalize static output
        run: |
          touch website/dist-live/.nojekyll

      - name: Deploy to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website/dist-live
          publish_branch: gh-pages
          keep_files: true
          cname: ''
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
